# Questions the app asks when someone creates a repo from this template, one per kind of
# record a tool fills. Each is optional: skipping it keeps Acme's example, like "Use example
# data". A tool answer keeps that tool's ingest workflow and drops the others for that kind.
# Any answer but "Use example data" drops Acme's example records of that kind, the concept
# folders built from them, and the folders built from those in turn. The example records you
# keep rebuild those pages when the repo is created.
questions:
  - id: support
    title: Where do your support conversations come from?
    hint: Closed support conversations the docs don't answer become docs gaps
    options:
      - id: other
        label: Somewhere else, I'll add them to the inbox
        icon: inbox
        files:
          exclude:
            - 'workflows/ingest-support-intercom.md'
            - 'workflows/ingest-support-pylon.md'
            - 'support/mock-*.md'
            - 'gaps/*.md'
            - 'digests/*.md'
      - id: example
        label: Use example data
        icon: flask
